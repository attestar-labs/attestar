name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build the SDK
        run: pnpm build:sdk

      # Runs every workspace package's `test` script (Vitest workspace projects).
      # A failing spec in any package - e.g. packages/sdk - fails this job.
      - name: Run all package tests
        run: pnpm -r test
