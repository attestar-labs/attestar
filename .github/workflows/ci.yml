name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      # Runs the `typecheck` script in every workspace package that defines one.
      # apps/web type-checks against the built workspace packages, so its script
      # compiles @attestar/sdk, attestar-client and usdc-client first; the three
      # library packages only need `tsc --noEmit`.
      - name: Type-check every package
        run: pnpm -r typecheck
