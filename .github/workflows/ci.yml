name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts -> target

      - name: Install stellar-cli
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli.tar.gz stellar
          sudo install -m 0755 stellar /usr/local/bin/stellar
          stellar --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `pnpm contracts:build` builds the Soroban workspace and emits
      # attestar.wasm + mock_token.wasm under packages/contracts/target.
      - name: Build contracts
        run: pnpm contracts:build

      - name: Fail on wasm size regression
        run: bash .github/scripts/check-wasm-size.sh
